[project]
name = "rfsn-agent"
version = "6.4.0"
description = "Policy-gated coding agent with security-hardened execution"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "hypothesis>=6.108.8",
    "coverage>=7.6.10",
    "diff-cover>=8.0.3",
    "bandit>=1.7.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "security: marks security-critical tests",
    "fuzz: marks property-based (Hypothesis) fuzz tests",
    "integration: marks integration tests requiring multiple components",
]
