# yaml-language-server: $schema=
allowed_step_types:
  - repo_search
  - repo_read_range
  - apply_patch
  - ensure_deps
  - run_tests

# Paths are repo-root-relative (src/foo.py, not repo/src/foo.py).
repo_root_required: true

max_patch_bytes: 200000
max_read_bytes: 200000

max_read_steps_per_iter: 6
max_search_steps_per_iter: 4
max_bytes_returned_per_iter: 250000

allowed_paths:
  - "**"

blocked_globs:
  - "**/.git/**"
  - "**/.env"
  - "**/*.pem"
  - "**/*id_rsa*"
  - "**/*secrets*"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.ruff_cache/**"
