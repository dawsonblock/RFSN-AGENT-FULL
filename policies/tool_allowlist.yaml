# yaml-language-server: $schema=
allowed_step_types:
  - repo_search
  - repo_read_range
  - apply_patch
  - ensure_deps
  - run_tests

# Paths are repo-root-relative (src/foo.py, not repo/src/foo.py).
# The executor cd's into /work/repo, so paths resolve correctly.
repo_root_required: false

max_patch_bytes: 200000
max_read_bytes: 200000

max_read_steps_per_iter: 6
max_search_steps_per_iter: 4
max_bytes_returned_per_iter: 250000

allowed_paths:
  - "**"

blocked_globs:
  - "**/.git/**"
  - "**/.env"
  - "**/.env.*"
  - "**/id_rsa"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/*.jks"
  - "**/.pypirc"
  - "**/.npmrc"
  - "**/.netrc"
  - "**/*_history"
  - "**/secrets.*"
  - "**/*token*"
  - "**/*credential*"
  - "**/Dockerfile*"
  - "**/docker-compose*"
  - "**/.github/**"
  - "**/.circleci/**"
  - "**/Jenkinsfile"
