# Deterministic kernel gate policy (final authority)
# ── Unified patch limits (single source of truth) ──
# These are the EFFECTIVE limits enforced at both
# kernel gate and tool_gateway layers.
max_patch_files: 3
max_patch_total_lines: 80
max_added_lines: 40
max_deleted_lines: 40

# Default safety posture: don't let the agent mutate
# tests/CI/deps without explicit intent.
forbid_test_edits: true
forbid_ci_edits: true
forbid_dep_manifest_edits: true

# When a patch exists, enforce that tests are present
# (targeted then suite).
enforce_tests: true

# Risk scoring thresholds
reject_risk_score: 60
risk_max: 0.6
success_min: 0.15
loop_max: 0.8
drift_max: 0.85
network_min_tier: 2

# λ controls risk vs expected-value balance:
# score = λ * risk - (1-λ) * expected_value
# Lower λ → more lenient toward focused patches.
risk_lambda: 0.7

# ── Per-step-type budgets (per iteration) ────────
# Hard caps enforced deterministically by the gate.
# Exceeding any count → BUDGET_EXCEEDED rejection.
step_budgets:
  repo_search:
    max_per_iter: 4
    timeout_s: 30
  repo_read_range:
    max_per_iter: 6
    max_lines_per_read: 300
    timeout_s: 15
  read_file:
    max_per_iter: 6
    timeout_s: 15
  detect_project:
    max_per_iter: 2
    timeout_s: 20
  detect_workdirs:
    max_per_iter: 2
    timeout_s: 30
  apply_patch:
    max_per_iter: 2
    timeout_s: 60
  ensure_deps:
    max_per_iter: 1
    timeout_s: 420
  run_tests:
    max_per_iter: 4
    timeout_s: 900
  run_cmd_template:
    max_per_iter: 6
    timeout_s: 300
  format_fix:
    max_per_iter: 2
    timeout_s: 240

# Total steps allowed in a single bundle.
max_steps_per_bundle: 15

# Patch verification contract.
patch_verify_window_steps: 4

# Executor output/storage guardrails.
max_step_log_bytes: 200000
max_artifact_dir_bytes: 1000000000
max_artifact_delta_bytes: 200000000

# repo_read_range path policy: block traversal and
# sensitive paths inside the repo.
blocked_read_prefixes:
  - ".git/"
  - ".github/workflows/"
  - "ci/"
  - "scripts/"
blocked_read_suffixes:
  - ".pem"
  - ".key"
  - ".p12"
  - ".env"
  - ".pypirc"
  - ".netrc"
