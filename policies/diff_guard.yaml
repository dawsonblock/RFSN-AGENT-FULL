# yaml-language-server: $schema=
# DEPRECATED: diff-guard limits have been merged into
# gate_policy.yaml as the single source of truth.
# tool_gateway now reads from gate_policy.yaml.
# This file is kept for backward compatibility but
# is no longer the authoritative source.
max_changed_files: 3
max_added_lines: 40
max_deleted_lines: 40

blocked_dependency_files:
  - "requirements.txt"
  - "requirements-dev.txt"
  - "requirements-ci.txt"
  - "constraints.txt"
  - "setup.py"
  - "setup.cfg"
  - "pyproject.toml"
  - "Pipfile"
  - "Pipfile.lock"
  - "poetry.lock"
  - "package.json"
  - "package-lock.json"
  - "yarn.lock"
  - "Gemfile"
  - "Gemfile.lock"
