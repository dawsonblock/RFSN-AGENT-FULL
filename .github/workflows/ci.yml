name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  golden-subset:
    name: "Golden Subset (Critical Path)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          # Install project in editable mode if setup.py exists, else just deps
          if [ -f setup.py ]; then pip install -e .; fi
      - name: CI Sanity Checks
        run: |
          bash scripts/ci_sanity.sh
      - name: Run Golden Subset Tests
        run: |
          # Phase 2 & 3: Code Quality & Cognitive Resilience
          coverage run -m pytest tests/test_master_upgrade.py

          # Phase 4: Security
          coverage run -a -m pytest tests/test_firewall.py

          # Phase 5: GitOps & HITL
          coverage run -a -m pytest tests/test_hitl.py
          coverage run -a -m pytest tests/test_gitops.py

          coverage report
          coverage xml -o coverage.xml

  full-suite:
    name: "Full Test Suite"
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements-ci.txt
      - name: Run All Tests
        run: |
          pytest -q

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install bandit
      - name: Bandit scan
        run: |
          bandit -r services -c .bandit || true

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set env
        run: |
          echo "DEEPSEEK_API_KEY=dummy" >> $GITHUB_ENV
          echo "RFSN_SEED=1" >> $GITHUB_ENV
          echo "LEDGER_FIXED_TS=1.0" >> $GITHUB_ENV
          echo "RFSN_SERVICE_TOKEN=dummy" >> $GITHUB_ENV
          echo "RFSN_DEV_MODE=0" >> $GITHUB_ENV
      - name: Build & smoke
        run: |
          docker compose build
          docker compose up -d
          sleep 10
          curl -sf -H "authorization: Bearer dummy" http://localhost:8000/health
          docker compose down
