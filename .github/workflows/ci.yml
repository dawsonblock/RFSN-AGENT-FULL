name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity checks
        run: bash scripts/ci_sanity.sh
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Unit tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report
          coverage xml -o coverage.xml

  diff-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run coverage
        run: |
          coverage run -m pytest -q
          coverage xml -o coverage.xml
      - name: Diff coverage
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          diff-cover coverage.xml --compare-branch "$BASE" --fail-under 80

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Bandit scan
        run: |
          bandit -r services -c .bandit

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set env
        run: |
          echo "DEEPSEEK_API_KEY=dummy" >> $GITHUB_ENV
          echo "RFSN_SEED=1" >> $GITHUB_ENV
          echo "LEDGER_FIXED_TS=1.0" >> $GITHUB_ENV
          echo "RFSN_SERVICE_TOKEN=dummy" >> $GITHUB_ENV
          echo "RFSN_DEV_MODE=0" >> $GITHUB_ENV
      - name: Build & smoke
        run: |
          docker compose build
          docker compose up -d
          curl -sf -H "authorization: Bearer dummy" http://localhost:8000/health
          curl -sf -H "authorization: Bearer dummy" http://localhost:8001/health
          curl -sf -H "authorization: Bearer dummy" http://localhost:8002/health
          curl -sf -H "authorization: Bearer dummy" http://localhost:8003/health
          docker compose down
