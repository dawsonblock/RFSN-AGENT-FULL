services:
  orchestrator:
    build: ./services/orchestrator
    ports: ["8000:8000"]
    volumes:
      - ./policies:/policies:ro
      - ./shared:/shared:ro
      - ./rfsn_kernel:/app/rfsn_kernel:ro
      - ./data:/data
    environment:
      LLM_URL: http://llm_service:8001
      TOOL_GATEWAY_URL: http://tool_gateway:8002
      LEARNER_URL: http://learner_service:8004
      RFSN_SEED: ${RFSN_SEED:-1}
      LEDGER_FIXED_TS: ${LEDGER_FIXED_TS:-1.0}
      RFSN_SERVICE_TOKEN: ${RFSN_SERVICE_TOKEN:-}
      RFSN_DEV_MODE: ${RFSN_DEV_MODE:-0}
      RFSN_WARM_SANDBOX: ${RFSN_WARM_SANDBOX:-1}
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
    depends_on:
      llm_service:
        condition: service_healthy
      tool_gateway:
        condition: service_healthy
      learner_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; t=os.getenv('RFSN_SERVICE_TOKEN',''); h={'Authorization':'Bearer '+t} if t else {}; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health', headers=h), timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  llm_service:
    build: ./services/llm_service
    # NOT exposed to host — only reachable via orchestrator (internal network)
    expose: ["8001"]
    volumes:
      - ./policies:/policies:ro
      - ./data:/data
      - ./shared:/shared:ro
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-reasoner}
      RFSN_SERVICE_TOKEN: ${RFSN_SERVICE_TOKEN:-}
      RFSN_DEV_MODE: ${RFSN_DEV_MODE:-0}
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; t=os.getenv('RFSN_SERVICE_TOKEN',''); h={'Authorization':'Bearer '+t} if t else {}; urllib.request.urlopen(urllib.request.Request('http://localhost:8001/health', headers=h), timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  tool_gateway:
    build: ./services/tool_gateway
    # NOT exposed to host — only reachable via orchestrator (internal network)
    expose: ["8002"]
    volumes:
      - ./policies:/policies:ro
      - ./shared:/shared:ro
    environment:
      EXECUTOR_URL: http://executor:8003
      RFSN_SERVICE_TOKEN: ${RFSN_SERVICE_TOKEN:-}
      RFSN_DEV_MODE: ${RFSN_DEV_MODE:-0}
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
    depends_on:
      executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; t=os.getenv('RFSN_SERVICE_TOKEN',''); h={'Authorization':'Bearer '+t} if t else {}; urllib.request.urlopen(urllib.request.Request('http://localhost:8002/health', headers=h), timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  executor:
    build: ./services/executor
    # NOT exposed to host — only reachable via tool_gateway (internal network)
    expose: ["8003"]
    volumes:
      - ./data:/data
      - ./policies:/policies:ro
      - ./shared:/shared:ro
    environment:
      BLESSED_IMAGE: ${BLESSED_IMAGE:-rfsn-blessed@sha256:208a2c2dac42ed9b3ca023b30cd815518070930274592844511aa34de21b6360}
      HOST_DATA_DIR: ${HOST_DATA_DIR:-${PWD}/data}
      RFSN_EXEC_USE_DOCKER: ${RFSN_EXEC_USE_DOCKER:-1}
      RFSN_ALLOW_LOCAL_EXEC: ${RFSN_ALLOW_LOCAL_EXEC:-0}
      RFSN_NETWORK_MIN_TIER: ${RFSN_NETWORK_MIN_TIER:-2}
      RFSN_STRICT_IMAGE_DIGEST: ${RFSN_STRICT_IMAGE_DIGEST:-1}
      RFSN_MAX_ARTIFACT_DIR_BYTES: ${RFSN_MAX_ARTIFACT_DIR_BYTES:-1000000000}
      RFSN_MAX_ARTIFACT_DELTA_BYTES: ${RFSN_MAX_ARTIFACT_DELTA_BYTES:-200000000}
      RFSN_SERVICE_TOKEN: ${RFSN_SERVICE_TOKEN:-}
      RFSN_DEV_MODE: ${RFSN_DEV_MODE:-0}
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2'
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; t=os.getenv('RFSN_SERVICE_TOKEN',''); h={'Authorization':'Bearer '+t} if t else {}; urllib.request.urlopen(urllib.request.Request('http://localhost:8003/health', headers=h), timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  learner_service:
    build: ./services/learner_service
    expose: ["8004"]
    volumes:
      - ./data:/data
      - ./shared:/shared:ro
    environment:
      LEARNER_DB: /data/learner.duckdb
      RFSN_SERVICE_TOKEN: ${RFSN_SERVICE_TOKEN:-}
      RFSN_DEV_MODE: ${RFSN_DEV_MODE:-0}
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; t=os.getenv('RFSN_SERVICE_TOKEN',''); h={'Authorization':'Bearer '+t} if t else {}; urllib.request.urlopen(urllib.request.Request('http://localhost:8004/health', headers=h), timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 8s

  # Blessed sandbox image — build once:
  #   docker compose --profile build-blessed build blessed
  # or directly:
  #   docker build -t ${BLESSED_BUILD_TAG:-rfsn-blessed:0.2} -f blessed.Dockerfile .
  # then set:
  #   BLESSED_IMAGE=$(docker image inspect ${BLESSED_BUILD_TAG:-rfsn-blessed:0.2} --format '{{index .RepoDigests 0}}')
  blessed:
    build:
      context: .
      dockerfile: blessed.Dockerfile
    image: ${BLESSED_BUILD_TAG:-rfsn-blessed:0.2}
    profiles: ["build-blessed"]
    entrypoint: ["echo", "blessed image built"]

  # SWE-bench runner — opt-in via: docker compose --profile bench run rfsn_swebench
  rfsn_swebench:
    build:
      context: .
      dockerfile: rfsn_swebench/Dockerfile
    profiles: ["bench"]
    volumes:
      - ./data:/data
      - ./policies:/policies:ro
      - ./shared:/shared:ro
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      - orchestrator
      - llm_service
      - learner_service
      - tool_gateway
      - executor
